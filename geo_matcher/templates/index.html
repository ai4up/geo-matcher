{% extends "base.html" %}

{% block title %}Choose Feature Type{% endblock %}
{% block map %}{% endblock %}
{% block body_class %}page-split{% endblock %}

{% block body %}
<main class="split-chooser" role="main" aria-label="Choose feature type">
  <a class="pane pane-left"
     href="{{ url_for('labeling.home_pair', ft='buildings') }}"
     aria-label="Choose Buildings">
    <span>Buildings</span>
  </a>

  <a class="pane pane-right"
     href="{{ url_for('labeling.home_pair', ft='places') }}"
     aria-label="Choose Places">
    <span>Places</span>
  </a>
</main>
{% endblock %}
