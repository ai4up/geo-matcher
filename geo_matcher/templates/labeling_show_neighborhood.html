{% extends "labeling_base.html" %}

{% block title %}Label Neighborhood{% endblock %}

{% block body %}
{{ super() }}

<div id="buttons">
    <form id="nbh-form" method="post" action="{{ feature_url('labeling.store_neighborhood') }}">
        <input type="hidden" name="id" value="{{ id }}">
        <input type="hidden" id="pairs-field" name="pairs" value="">
        <input type="hidden" id="added-field" name="added" value="">
        <input type="hidden" id="removed-field" name="removed" value="">
        <button type="button" id="submit-btn" class="btn btn-submit" onclick="submitNeighborhood()">Submit</button>
    </form>
</div>

<div id="legend">
    <h4>Keyboard Shortcuts</h4>
    <ul>
        <li><kbd>&#9166;</kbd> Submit</li>
        <li><kbd>&uarr;</kbd> Back</li>
        <li><kbd>?</kbd> Toggle Legend</li>
    </ul>
    <button onclick="toggleLegend()">Close</button>
</div>

{% endblock %}

{% block scripts %}
{{ super() }}

<script type="text/javascript">
    let inFlight = false;

    function submitNeighborhood() {
        if (inFlight) return;
        inFlight = true;

        const iframe = document.querySelector("iframe");
        const iframeWindow = iframe?.contentWindow;

        const added = iframeWindow?.mapController?.getAddedMatches?.() || [];
        const removed = iframeWindow?.mapController?.getRemovedMatches?.() || [];
        const pairs = iframeWindow?.pairs || [];

        document.getElementById('pairs-field').value = JSON.stringify(pairs);
        document.getElementById('added-field').value = JSON.stringify(added);
        document.getElementById('removed-field').value = JSON.stringify(removed);

        document.getElementById('nbh-form').submit();
    }

    document.addEventListener("keydown", function (e) {
        if (inFlight) return;

        if (["ArrowUp", "Enter", "?", "/"].includes(e.key)) {
            e.preventDefault();
        }

        if (e.key === "ArrowUp") {
            window.history.back();
        } else if (e.key === "Enter") {
            submitNeighborhood();
        } else if (e.key === "?" || e.key === "/") {
            toggleLegend();
        }
    });
</script>
{% endblock %}
