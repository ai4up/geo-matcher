<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>{% block title %}Labeling Tool{% endblock %}</title>

    <link rel="stylesheet" href="{{ url_for('static', filename='css/common.css') }}" />

    {% block head %}{% endblock %}
</head>
<body class="{% block body_class %}{% endblock %}">
    {% block map %}
        {% if map_file is defined and map_file %}
            <div id="map">
                <iframe src="{{ url_for('static', filename='maps/' ~ map_file) }}" width="100%" height="100%">
                </iframe>
            </div>
        {% endif %}
    {% endblock %}


    {% block body %}{% endblock %}

    {% block scripts %}{% endblock %}
</body>
</html>
